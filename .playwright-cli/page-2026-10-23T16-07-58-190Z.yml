    - main [ref=e13]:
      - paragraph [ref=e192]: 1951. A camp in the north, past the railhead, on a river that is ice for seven months of the year. The nearest town is four hundred kilometres away and does not want you.
      - paragraph [ref=e193]: Article 58-10, anti-Soviet agitation. Ten years. You said something at a table.
      - paragraph [ref=e194]: "Ten years is not a thing a man can hold in his head. The old ones say: do not count the years, count the winter. When the ice goes out on the river in May, the worst of it is over."
      - paragraph [ref=e195]: "There is another way out: through the wire, and down the river on the ice. Most men who take it are found in the spring."
      - paragraph [ref=e196]: "The old ones say something else as well. Learn to see a good day: a second bowl, dry foot cloths, eleven minutes of sun. A man who can still tell a good day from a bad one is not finished."
      - paragraph [ref=e197]: You stopped counting on the train. This morning you start again, from one.
      - paragraph [ref=e198]: Each day you choose how to eat, how to work and how to spend the night. Once you have lived a day, the days can run on their own, the way you lived it, until something happens.
