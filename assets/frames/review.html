<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ten Years — frame collection</title>
<style>
:root{color-scheme:dark;--paper:#d6cdb8;--mute:#918776;--line:#383329;--bg:#0f0e0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}main{max-width:1440px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px}h1{font-size:20px;font-weight:500;letter-spacing:.16em;margin:0 0 8px}p{margin:0;color:var(--mute)}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}a{color:inherit;text-underline-offset:4px}button{font:inherit;background:transparent;border:1px solid var(--line);color:var(--paper);padding:7px 10px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--paper)}#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 18px}article{min-width:0}figure{margin:0}figure>a{display:block}img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0a0908}.game img{filter:contrast(1.05) brightness(.9)}figcaption{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding-top:8px}figcaption span{color:var(--mute)}details{margin-top:8px}summary{color:var(--mute);font-size:12px;cursor:pointer}.variants{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-top:8px}.variants a{font-size:10px;text-decoration:none;color:var(--mute)}.variants img{margin-bottom:4px}.selected{color:var(--paper)!important}footer{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;font-size:12px;color:var(--mute)}@media(max-width:900px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:start;flex-direction:column}}@media(max-width:560px){main{padding:18px}#grid{grid-template-columns:1fr}}
</style>
<main>
<header><div><h1>TEN YEARS</h1><p>Twelve selected linocuts · three variants per frame</p></div><nav><button id="filter" aria-pressed="false">Game treatment: off</button><button id="variants" aria-pressed="false">Show variants</button><a href="../../index.html">Play</a></nav></header>
<section id="grid" aria-label="Selected frame collection"></section>
<footer>Generated with built-in imagegen across four concurrent groups. Native PNGs exceed 1600 × 900; shown in the game's 16:9 crop. <a href="../../prompts/frames-production.md">Art direction</a> · Exact prompts and source paths: <a href="production/opening.json">opening</a>, <a href="production/barracks.json">barracks</a>, <a href="production/camp-work.json">camp work</a>, <a href="production/escape.json">escape</a>.</footer>
</main>
<script>
const frames=[['title','The alarm',1],['hut_morning','Before dawn',1],['count','The count',3],['table','The ration',1],['site','The work site',2],['noon','Noon',2],['gate','The search',1],['hut_night','The barracks',1],['cells','The cell',1],['wire','The wire',3],['river','The river',2],['dead','The empty bunk',1]];
document.querySelector('#grid').innerHTML=frames.map(([name,title,pick],i)=>`<article><figure><a href="${name}.png" target="_blank"><img src="${name}.png" alt="${title}, black ink on aged cream paper"></a><figcaption><a href="${name}.png">${String(i+1).padStart(2,'0')} · ${title}</a><span>${name}</span></figcaption></figure><details><summary>Three variants · selected ${String(pick).padStart(2,'0')}</summary><div class="variants">${[1,2,3].map(v=>`<a class="${v===pick?'selected':''}" href="variants/${name}-${String(v).padStart(2,'0')}.png" target="_blank"><img loading="lazy" src="variants/${name}-${String(v).padStart(2,'0')}.png" alt="${title}, variant ${v}">${String(v).padStart(2,'0')}${v===pick?' · selected':''}</a>`).join('')}</div></details></article>`).join('');
document.querySelector('#filter').onclick=function(){const on=document.body.classList.toggle('game');this.textContent=`Game treatment: ${on?'on':'off'}`;this.setAttribute('aria-pressed',String(on))};
document.querySelector('#variants').onclick=function(){const on=this.getAttribute('aria-pressed')!=='true';document.querySelectorAll('details').forEach(d=>d.open=on);this.textContent=on?'Hide variants':'Show variants';this.setAttribute('aria-pressed',String(on))};
</script>
</html>
